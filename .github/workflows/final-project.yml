name: Final Project - Budget Buddy CLI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "final_project/**"
      - ".github/workflows/final-project.yml"
  pull_request:
    paths:
      - "final_project/**"
      - ".github/workflows/final-project.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: final_project

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -v
